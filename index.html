<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahmi - Media Sosial</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
            position: relative;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(255,255,255,0.5);
        }

        .tagline {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .profile-pic {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            margin: 0 auto 30px;
            border: 6px solid #fff;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .profile-pic:hover {
            transform: scale(1.05);
        }

        .social-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 18px 30px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }

        .social-btn:hover::before {
            left: 100%;
        }

        .social-btn i {
            font-size: 1.4rem;
            width: 30px;
        }

        .whatsapp {
            background: linear-gradient(45deg, #25D366, #128C7E);
            color: white;
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.4);
        }

        .whatsapp:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(37, 211, 102, 0.6);
        }

        .instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 48, 79, 0.4);
        }

        .instagram:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(255, 48, 79, 0.6);
        }

        .tiktok {
            background: linear-gradient(45deg, #000000 0%, #FF0050 50%, #FF7043 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 0, 80, 0.4);
        }

        .tiktok:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(255, 0, 80, 0.6);
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #888;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 25px;
                margin: 20px;
            }
            
            .logo {
                font-size: 2.8rem;
            }
            
            .social-btn {
                padding: 16px 25px;
                font-size: 1rem;
            }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="profile-pic" src="https://via.placeholder.com/140x140/667eea/ffffff?text=FAHMI" alt="Fahmi">
            <!-- Ganti dengan foto profil kamu -->
            <img src="https://github.com/fahmifaddhlurrohman-commits/sosial-media/blob/8836ee87a5908f0c0ef88d8fe05d85169be32195/README.md" alt="Fahmi" style="width:100%; height:100%; border-radius: inherit;">
        </div>
        
        <h1 class="logo">FAHMI</h1>
        <p class="tagline">Ikuti perjalanan saya di media sosial!</p>
        
        <div class="social-grid">
            <a href="https://wa.me/6281229473677?text=Halo%20Fahmi!" class="social-btn whatsapp" target="_blank">
                <i class="fab fa-whatsapp"></i>
                WhatsApp
            </a>

            <a href="https://instagram.com/fahmiii_2208" class="social-btn instagram" target="_blank">
                <i class="fab fa-instagram"></i>
                Instagram
            </a>

            <a href="https://tiktok.com/@anaomali_" class="social-btn tiktok" target="_blank">
                <i class="fab fa-tiktok"></i>
                TikTok
            </a>
        </div>
        
        <div class="footer">
            <p>© its creator is Fahmi Faddhlurrohman in 2026. All rights reserved.</p>
        </div>
    </div>

    <script>
        // Efek partikel floating
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.width = particle.style.height = (Math.random() * 8 + 4) + 'px';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 4) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        createParticles();

        // Efek klik button
        document.querySelectorAll('.social-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);
            });
        });
    </script>
</body>
</html>
